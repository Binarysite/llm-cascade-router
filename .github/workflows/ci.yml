name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      # tsc --checkJs on src/, plus tsc --strict on index.d.ts and claude.d.ts.
      - run: npm run typecheck
      # Runtime dependencies only (there are none), so a new advisory in a dev
      # tool such as TypeScript cannot turn CI red without a code change.
      - run: npm audit --omit=dev --audit-level=high
      # CLINC150 at a pinned commit, SHA-256 checked; the tests then rerun the local
      # bench and the chart and fail if either differs from the committed report.
      - run: npm run clinc:fetch
      # node --test with a floor of 95% lines, 90% branches on src/
      - run: npm run coverage
      # Exits 1 if a cheap layer gives a wrong answer on the in-sample bank.
      - run: npm run bench
